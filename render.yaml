services:
  - type: web
    name: inbox-zero-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true

    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: DATABASE_URL
        fromDatabase:
          name: inbox-zero-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: inbox-zero-redis
          property: connectionString

      - key: NEXT_PUBLIC_BASE_URL
        sync: false

      - key: AUTH_SECRET
        generateValue: true

      - key: INTERNAL_API_KEY
        generateValue: true

      - key: EMAIL_ENCRYPT_SECRET
        generateValue: true

      - key: EMAIL_ENCRYPT_SALT
        generateValue: true

      - key: MICROSOFT_WEBHOOK_CLIENT_STATE
        generateValue: true

      - key: DEFAULT_LLM_PROVIDER
        value: openai

      - key: LLM_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: MICROSOFT_CLIENT_ID
        sync: false

      - key: MICROSOFT_CLIENT_SECRET
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: POSTHOG_API_KEY
        sync: false

  - type: worker
    name: inbox-zero-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile

    dockerCommand: >
      sh -c "cd apps/web &&
      pnpm prisma migrate deploy &&
      pnpm start-worker"

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: inbox-zero-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: inbox-zero-redis
          property: connectionString

databases:
  - name: inbox-zero-db
    plan: starter

redis:
  - name: inbox-zero-redis
    plan: starter